garmin:
  # Direct Ethernet connection to the Garmin SERV on the motorhome's
  # internal network. The SERV no longer exposes WiFi (its bootstrap
  # message reports hasWifi:false), so the Pi must be cabled to the same
  # Ethernet network. The web UI runs at http://172.16.11.7:8888/.
  ws_url: ws://172.16.11.7:8888/ws
  heartbeat_interval: 4s
  # origin: http://172.16.11.7:8888
  trace_window: 3s

location:
  enabled: true
  # Defaults to the Teltonika RUTX50 GPS status API.
  provider: rutx50
  poll_interval: 5m
  rutx50:
    endpoint: http://192.168.51.1/api/gps/position/status
    login_endpoint: http://192.168.51.1/api/login
    username: admin
    # Prefer password_file over putting the router password in this config.
    # password_file: /var/lib/xtura/rutx50-password
    # Set this true only if using the HTTPS API with a self-signed device certificate.
    insecure_skip_verify: false
    timeout: 10s
    # auth_token: optional fixed bearer token instead of username/password login
  timezone:
    # Uses local GPS coordinate lookup via github.com/ringsaturn/tzf by default.
    provider: tzf
    timeout: 10s
  movement:
    # Reports is_moving when cumulative GPS displacement in this window crosses
    # the threshold. This is intentionally coarse for automation rules.
    window: 15m
    min_distance_meters: 250
  timezone_update:
    enabled: true
    interval: 1h
    # Keep the heating schedule timezone in /var/lib/xtura/config.yaml in step
    # with the resolved GPS timezone.
    update_config: true
    # The deploy script installs a narrow sudoers rule for this command.
    command: ["sudo", "/usr/bin/timedatectl", "set-timezone"]

tracking:
  # Record fixes only while the engine is running (Garmin power state). Set to
  # false to expose manual start/stop in the web UI.
  when_engine_on: true
  sample_interval: 5s
  dir: /var/lib/xtura/tracks

overview:
  usable_battery_capacity_ah: 100
  # Capacity of the tank the Mopeka sensor is fitted to, in litres. This
  # OVERRIDES mopeka.tank_capacity_litres when non-zero.
  #
  # A Mopeka measures ONE tank. If you run a twin cylinder set with the sensor
  # on only one of them, put the capacity of THAT cylinder here, not the
  # combined total - otherwise the litres figure implies a level for the
  # unmeasured cylinder that you have no way of knowing.
  #
  # Gaslow 11kg cylinders carry approx 21L at their 80% fill stop, so a sensor
  # on one of a pair is 21, not 42.
  gas_tank_capacity_litres: 0
  comfort_thresholds: [10, 18, 24, 30]
  # Victron battery bank configuration
  battery_capacity_ah: 660
  battery_nominal_voltage: 12.8
  battery_floor_soc: 20
  battery_ready_soc: 95
  multiplus_max_charge_current_a: 120
  charge_efficiency: 0.99

water_history:
  threshold_percent: 5
  prediction_threshold_percent: 10
  settling_period: 10m
  grouping_window: 1h

switchbot:
  # BLE temperature/humidity sensors shown in the Overview Temperature panel.
  # Disabled by default so the service behaves exactly as before. When disabled
  # the Alde reading (from Garmin) remains the big card.
  # To configure, run: switchbotctl discover (populates the rolling seen table),
  # then PUT /v1/sensors/settings (or edit this file and restart). The daemon
  # requires CAP_NET_ADMIN and CAP_NET_RAW for the HCI socket.
  enabled: false
  # hci_device: hci0
  # sensors:
  #   - name: Main       # config order controls the small-row display order
  #     mac: c5:65:68:81:84:32
  #     primary: true
  #   - name: Outside
  #     mac: d6:66:69:92:95:43
  #   - name: Display
  #     mac: e7:77:7a:a3:a6:54

mopeka:
  # Mopeka Pro Check LPG tank level sensor (BLE, company ID 0x0059).
  # The MAC must match the sensor's BLE address.
  #
  # tank_capacity_litres is the total volume of all connected tanks. A Mopeka
  # senses ONE tank, so with the sensor on only one of a twin cylinder set
  # this is a modelled figure for the pair rather than a measurement.
  #
  # tank_fill_height_mm is the INTERIOR height of the tank, measured from the
  # sensor face up to the full level. It is not the external height: a
  # composite bottle is around 530mm tall to the top of the filler elbow, but
  # that includes the base and the multivalve collar, neither of which holds
  # liquid above the sensor.
  #
  # tank_base_radius_mm is the radius of the hemispherical base the sensor sits
  # in. Most composite LPG cylinders have one. It matters because a level
  # below this radius is still up inside the dome, where the tank is much
  # narrower than the full bore and the cross-section grows with the square of
  # the level. Reading such a level as a plain fraction of tank_fill_height_mm
  # overstates it: in the Gaslow geometry below, 146mm of liquid reports 43%
  # under a linear model but 33% by volume, which is what the Mopeka app
  # shows. Omit the key to accept the default; set it to 0 only for a
  # genuinely straight-walled tank.
  #
  # To calibrate, no tape measure or vendor spec is needed. Fill the tank to
  # its automatic fill stop, then read the distance from the service log
  # ("mopeka reading: ... dist=NNNmm") or the Mopeka app. That distance IS
  # tank_fill_height_mm, because a full tank reads exactly the full depth.
  # Calibrate against a full tank, never an empty one, which reads near zero.
  #
  # Omit either key to accept the compiled-in default. Both are calibrated for
  # a Gaslow 11kg cylinder: a 300mm bore (150mm dome + 190mm cylinder) holding
  # 20.5L, with the 80% automatic fill stop at 282mm of level.
  #
  # (Gaslow 11kg defaults: tank_fill_height_mm 340, tank_base_radius_mm 150)
  enabled: false
  # mac: "F6:42:96:C8:38:AA"
  # tank_capacity_litres: 22
  # tank_fill_height_mm: 340
  # tank_base_radius_mm: 150

notifications:
  # Xtura generates this pair on first startup and persists it here. It is
  # stable server identity: do not rotate it while browsers are subscribed.
  # To generate it manually, run:
  #   ./scripts/generate-vapid-keys.sh -config /var/lib/xtura/config.yaml \
  #     -subject mailto:you@example.com
  # vapid_public_key: ""
  # vapid_private_key: ""
  # subject: "mailto:you@example.com"

host:
  # How often the Pi status pane samples host metrics. Zero uses the 5s default.
  sample_interval: 5s

automation:
  timezone: Europe/London
  heating_programs:
    - id: everyday-default
      days: ["mon", "tue", "wed", "thu", "fri", "sat", "sun"]
      periods:
        - start: "00:00"
          mode: "off"
        - start: "13:34"
          mode: "heat"
          target_celsius: 20.0
        - start: "13:36"
          mode: "off"

      # Quick local test pattern:
      # Replace the periods above with something short and nearby, for example:
      #
      # periods:
      #   - start: "00:00"
      #     mode: "off"
      #   - start: "14:00"
      #     mode: "heat"
      #     target_celsius: 18.0
      #   - start: "14:10"
      #     mode: "heat"
      #     target_celsius: 21.0
      #   - start: "14:20"
      #     mode: "off"
      #
      # That lets you verify:
      # - off -> heat
      # - heat -> heat (setpoint only)
      # - heat -> off

api:
  # Tailscale Serve is the only external HTTPS entry point.
  listen: 127.0.0.1:80
