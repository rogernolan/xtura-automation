garmin:
  # Simulated SERV via scripts/sim/run-sim.sh / cmd/servsim.
  ws_url: ws://localhost:8090/ws
  heartbeat_interval: 4s
  trace_window: 3s

api:
  listen: 0.0.0.0:8091

switchbot:
  enabled: true
  hci_device: hci0
  sensors:
    - name: Main
      mac: "AA:BB:CC:DD:EE:01"
      primary: true
    - name: Outside
      mac: "AA:BB:CC:DD:EE:02"
    - name: Display
      mac: "AA:BB:CC:DD:EE:03"

mopeka:
  enabled: true
  mac: "F6:42:96:C8:38:AA"
  tank_capacity_litres: 22
  tank_fill_height_mm: 290

water_history:
  threshold_percent: 5
  prediction_threshold_percent: 10
  settling_period: 10m
  grouping_window: 1h

automation:
  timezone: Europe/London
  heating_programs:
    - id: sim-off
      days: ["mon", "tue", "wed", "thu", "fri", "sat", "sun"]
      periods:
        - start: "00:00"
          mode: "off"
